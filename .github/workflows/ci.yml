name: CI

on:
  workflow_call:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q easynews_indexer tests
      - run: ruff check .
      - run: pytest
      - name: Docker build smoke test
        run: docker build -t easynews-indexer:test .
