services:
  easynews_as_indexer:
    build: .
    image: ghcr.io/dumdummy476-hub/easynews_as_indexer:latest
    env_file:
      - .env
    environment:
      PORT: "8081"
    ports:
      - "8081:8081"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
